<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title & Description -->
    <title>Andrea Donati | Software Engineer</title>
    <meta
      name="description"
      content="Andrea Donati is a software engineer who architects and ships production platforms — and brings that same discipline to building, fixing, and shipping technical work for small businesses under Donati Designs."
    />
    <meta
      name="keywords"
      content="Andrea Donati, software engineer, full-stack developer, Android developer, technical architect, Donati Designs"
    />
    <link rel="canonical" href="https://adonati.com/" />

    <!-- Open Graph -->
    <meta property="og:title" content="Andrea Donati | Software Engineer" />
    <meta
      property="og:description"
      content="Software engineer who ships production platforms — and applies the same discipline to small-business web and technical work."
    />
    <meta property="og:type" content="profile" />
    <meta property="og:url" content="https://adonati.com/" />
    <meta property="og:image" content="https://adonati.com/logo.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Andrea Donati | Software Engineer" />
    <meta
      name="twitter:description"
      content="Software engineer who ships production platforms — and applies the same discipline to small-business web and technical work."
    />
    <meta name="twitter:image" content="https://adonati.com/logo.png" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#14121a" />

    <!-- Favicon -->
    <link rel="icon" href="/Donati-Designs.ico" type="image/x-icon" />

    <!-- Type system: Space Grotesk (display), JetBrains Mono (structural/meta), Inter (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Preload Brasika (reserved for the "Donati Designs" sub-brand wordmark only) -->
    <link
      rel="preload"
      href="/fonts/Brasika.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      href="/fonts/Brasika.woff"
      as="font"
      type="font/woff"
      crossorigin="anonymous"
    />

    <!-- Structured Data: Andrea Donati is the primary entity; Donati Designs is her freelance service line -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Andrea Donati",
        "url": "https://adonati.com",
        "jobTitle": "Software Engineer",
        "image": "https://adonati.com/logo.png",
        "description": "Software engineer with experience architecting and shipping production platforms for enterprise clients, who applies the same engineering discipline to small-business web and technical work.",
        "worksFor": {
          "@type": "Organization",
          "name": "TBWA"
        },
        "owns": {
          "@type": "Organization",
          "name": "Donati Designs",
          "url": "https://adonati.com/work",
          "description": "Andrea Donati's freelance service line for small-business web and technical work."
        }
      }
    </script>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
